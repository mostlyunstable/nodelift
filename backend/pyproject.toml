[project]
name = "nodecraft-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "certifi>=2026.7.22",
    "fastapi>=0.146.0",
    "httpcore[asyncio]>=1.0.9",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "trustme>=1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["app"]

# Architecture rules, checked by `lint-imports` (part of `make lint`). See docs/architecture.md.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain and the engine know nothing about the web, databases or processes"
type = "forbidden"
source_modules = ["app.domain", "app.engine"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn", "sqlalchemy", "alembic", "httpcore", "keyring",
    "app.api", "app.services", "app.storage", "app.runtime", "app.nodes",
]

[[tool.importlinter.contracts]]
name = "Repository analysis is pure: no web, database, services or process spawning"
type = "forbidden"
source_modules = ["app.explorer"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "app.api", "app.services", "app.storage", "app.runtime", "subprocess"]

[[tool.importlinter.contracts]]
name = "Only the composition layer wires storage into the application"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.storage", "sqlalchemy"]
allow_indirect_imports = true  # the API may use services, which use storage; it may not import it itself

[[tool.importlinter.contracts]]
name = "Lower layers never reach up into the API or the services"
type = "forbidden"
source_modules = ["app.storage", "app.runtime", "app.nodes", "app.examples"]
forbidden_modules = ["app.api", "app.services"]

[[tool.importlinter.contracts]]
name = "Services do not depend on the HTTP layer"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api", "fastapi", "starlette"]
